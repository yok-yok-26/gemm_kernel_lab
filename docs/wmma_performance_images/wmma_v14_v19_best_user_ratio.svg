<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #17202a; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 13px; fill: #566573; }
.axis { font-size: 12px; fill: #34495e; }
.small { font-size: 11px; fill: #566573; }
.celltext { font-size: 12px; font-weight: 700; fill: #111827; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="43" class="title">Best user / cuBLAS half ratio across sizes</text>
<text x="40" y="66" class="subtitle">Ratio > 1 means fastest user WMMA variant exceeds the same-precision cuBLAS half baseline.</text>
<line x1="100" y1="470.0" x2="1220" y2="470.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="90" y="474.0" text-anchor="end" class="axis">0.00x</text>
<line x1="100" y1="342.8" x2="1220" y2="342.8" stroke="#e5e7eb" stroke-width="1"/>
<text x="90" y="346.8" text-anchor="end" class="axis">0.50x</text>
<line x1="100" y1="215.6" x2="1220" y2="215.6" stroke="#111827" stroke-width="2"/>
<text x="90" y="219.6" text-anchor="end" class="axis">1.00x</text>
<line x1="100" y1="90.0" x2="1220" y2="90.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="90" y="94.0" text-anchor="end" class="axis">1.49x</text>
<rect x="141.1" y="299.1" width="104.5" height="170.9" fill="#dc2626" rx="3"><title>256^3 best v18 / cuBLAS half = 0.672x</title></rect>
<text x="193.3" y="291.1" text-anchor="middle" class="axis">0.672x</text>
<text x="193.3" y="498" text-anchor="middle" class="axis">256^3</text>
<rect x="327.7" y="130.7" width="104.5" height="339.3" fill="#2ca25f" rx="3"><title>512^3 best v16 / cuBLAS half = 1.334x</title></rect>
<text x="380.0" y="122.7" text-anchor="middle" class="axis">1.334x</text>
<text x="380.0" y="498" text-anchor="middle" class="axis">512^3</text>
<rect x="514.4" y="162.3" width="104.5" height="307.7" fill="#2ca25f" rx="3"><title>1024^3 best v18 / cuBLAS half = 1.209x</title></rect>
<text x="566.7" y="154.3" text-anchor="middle" class="axis">1.209x</text>
<text x="566.7" y="498" text-anchor="middle" class="axis">1024^3</text>
<rect x="701.1" y="208.5" width="104.5" height="261.5" fill="#2ca25f" rx="3"><title>2048^3 best v18 / cuBLAS half = 1.028x</title></rect>
<text x="753.3" y="200.5" text-anchor="middle" class="axis">1.028x</text>
<text x="753.3" y="498" text-anchor="middle" class="axis">2048^3</text>
<rect x="887.7" y="228.0" width="104.5" height="242.0" fill="#f59e0b" rx="3"><title>4096^3 best v18 / cuBLAS half = 0.951x</title></rect>
<text x="940.0" y="220.0" text-anchor="middle" class="axis">0.951x</text>
<text x="940.0" y="498" text-anchor="middle" class="axis">4096^3</text>
<rect x="1074.4" y="308.0" width="104.5" height="162.0" fill="#dc2626" rx="3"><title>8192^3 best v19 / cuBLAS half = 0.637x</title></rect>
<text x="1126.7" y="300.0" text-anchor="middle" class="axis">0.637x</text>
<text x="1126.7" y="498" text-anchor="middle" class="axis">8192^3</text>
</svg>
