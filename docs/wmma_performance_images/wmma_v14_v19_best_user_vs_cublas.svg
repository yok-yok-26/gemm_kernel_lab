<rect x="1066.9" y="90.0" width="56.0" height="500.0" fill="#4c78a8" rx="3"><title>cuBLAS half 8192^3: 60.98 TFLOP/s, 18.02960 ms</title></rect>
<text x="1094.9" y="83.0" text-anchor="middle" class="small">61.0</text>
<rect x="1129.7" y="271.6" width="56.0" height="318.4" fill="#2ca25f" rx="3"><title>v19 8192^3: 38.83 TFLOP/s, 28.31510 ms</title></rect>
<text x="1157.7" y="264.6" text-anchor="middle" class="small">38.8</text>
