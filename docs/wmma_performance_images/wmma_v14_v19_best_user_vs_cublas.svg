<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #17202a; }
.title { font-size: 24px; font-weight: 700; }
.subtitle { font-size: 13px; fill: #566573; }
.axis { font-size: 12px; fill: #34495e; }
.small { font-size: 11px; fill: #566573; }
.celltext { font-size: 12px; font-weight: 700; fill: #111827; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="43" class="title">Best user WMMA vs cuBLAS half across sizes</text>
<text x="40" y="66" class="subtitle">Best user is selected among v14..v19 for each size. Bars show mean TFLOP/s.</text>
<line x1="100" y1="590.0" x2="1220" y2="590.0" stroke="#e5e7eb"/>
<text x="90" y="594.0" text-anchor="end" class="axis">0.0</text>
<line x1="100" y1="465.0" x2="1220" y2="465.0" stroke="#e5e7eb"/>
<text x="90" y="469.0" text-anchor="end" class="axis">15.2</text>
<line x1="100" y1="340.0" x2="1220" y2="340.0" stroke="#e5e7eb"/>
<text x="90" y="344.0" text-anchor="end" class="axis">30.5</text>
<line x1="100" y1="215.0" x2="1220" y2="215.0" stroke="#e5e7eb"/>
<text x="90" y="219.0" text-anchor="end" class="axis">45.7</text>
<line x1="100" y1="90.0" x2="1220" y2="90.0" stroke="#e5e7eb"/>
<text x="90" y="94.0" text-anchor="end" class="axis">61.0</text>
<rect x="133.6" y="523.4" width="56.0" height="66.6" fill="#4c78a8" rx="3"><title>cuBLAS half 256^3: 8.13 TFLOP/s, 0.00413 ms</title></rect>
<text x="161.6" y="516.4" text-anchor="middle" class="small">8.1</text>
<rect x="196.3" y="545.2" width="56.0" height="44.8" fill="#2ca25f" rx="3"><title>v18 256^3: 5.46 TFLOP/s, 0.00615 ms</title></rect>
<text x="224.3" y="538.2" text-anchor="middle" class="small">5.5</text>
<text x="193.3" y="618" text-anchor="middle" class="axis">256^3</text>
<text x="193.3" y="638" text-anchor="middle" class="small">best v18</text>
<rect x="320.3" y="455.7" width="56.0" height="134.3" fill="#4c78a8" rx="3"><title>cuBLAS half 512^3: 16.38 TFLOP/s, 0.01639 ms</title></rect>
<text x="348.3" y="448.7" text-anchor="middle" class="small">16.4</text>
